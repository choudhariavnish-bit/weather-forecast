<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Weather Dashboard</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="css/app.css" rel="stylesheet"></head><body class="dashboard-bg"><div id="appNav"></div><main class="container-fluid py-4 px-lg-4"><div id="msg"></div><div class="row g-3 align-items-end mb-3"><div class="col-md-5 col-lg-4"><label class="form-label fw-semibold">Select City</label><select id="city" class="form-select form-select-lg"></select></div><div class="col-auto"><a class="btn btn-primary btn-lg" href="select-city.html">+ Add City</a></div><div class="col-auto"><button id="refresh" class="btn btn-outline-secondary btn-lg">↻ Refresh</button></div></div><div id="loading" class="text-center py-5 d-none"><div class="spinner-border text-primary"></div><div class="mt-2">Syncing weather...</div></div><section id="weather" class="d-none"><div class="row g-3"><div class="col-lg-5"><div class="card hero-card shadow-sm border-0 h-100"><div class="card-body p-4"><div class="d-flex justify-content-between"><div><div id="place" class="text-white-50"></div><h1 id="temp" class="display-1 fw-bold mb-0"></h1><div id="condition" class="fs-4"></div><div id="feels" class="text-white-50 mt-1"></div></div><img id="icon" class="weather-icon" alt="weather"></div><div class="row g-2 mt-4" id="metrics"></div></div></div></div><div class="col-lg-7"><div class="card shadow-sm border-0 h-100"><div class="card-body"><div class="d-flex justify-content-between align-items-center mb-3"><h5 class="mb-0">Weather Alerts</h5><span class="badge text-bg-danger" id="alertCount">0</span></div><div id="alerts"><div class="text-secondary">No active alerts reported for this location.</div></div></div></div></div></div><div class="card shadow-sm border-0 mt-3"><div class="card-body"><h5 class="mb-3">5-Day Forecast</h5><div id="forecast" class="row g-3"></div></div></div><div class="card shadow-sm border-0 mt-3"><div class="card-body"><h5 class="mb-3">1-Day Step Timeline</h5><div id="timeline" class="timeline"></div></div></div></section></main><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script><script src="js/nav.js"></script><script src="js/dashboard.js"></script></body></html>
