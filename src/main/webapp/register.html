<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Register User</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="css/app.css" rel="stylesheet"></head><body class="auth-bg"><div class="container py-5"><div class="row justify-content-center"><div class="col-md-8 col-lg-6"><div class="card shadow-lg border-0"><div class="card-body p-4 p-lg-5"><div class="text-center mb-4"><h3>Register User</h3><p class="text-secondary">Create your weather portal account</p></div><div id="msg"></div><form id="regForm"><div class="row"><div class="col-md-6 mb-3"><label class="form-label">Name</label><input id="fullName" class="form-control" required></div><div class="col-md-6 mb-3"><label class="form-label">Mobile</label><input id="mobile" class="form-control" inputmode="numeric" required></div></div><div class="mb-3"><label class="form-label">Email</label><input id="email" type="email" class="form-control" required></div><div class="mb-3"><label class="form-label">City</label><select id="cityId" class="form-select" required><option>Loading cities...</option></select></div><div class="row"><div class="col-md-6 mb-3"><label class="form-label">Password</label><input id="password" type="password" minlength="6" class="form-control" required></div><div class="col-md-6 mb-3"><label class="form-label">Confirm Password</label><input id="confirm" type="password" minlength="6" class="form-control" required></div></div><button class="btn btn-primary w-100 btn-lg">Create Account</button></form><div class="text-center mt-4"><a href="login.html">Back to Login</a></div></div></div></div></div></div><script src="js/register.js"></script></body></html>
