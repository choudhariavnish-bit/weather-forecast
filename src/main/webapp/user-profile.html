<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>User Profile</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="css/app.css" rel="stylesheet"></head><body class="dashboard-bg"><div id="appNav"></div><main class="container py-5"><div class="card shadow-sm border-0"><div class="card-body p-4 p-lg-5"><h3>User Profile</h3><hr><div id="profile">Loading...</div></div></div></main><script src="js/nav.js"></script><script>fetch('api/profile').then(r=>{if(!r.ok)location.href='login.html';return r.json()}).then(p=>{document.getElementById('profile').innerHTML=`<div class="row g-3"><div class="col-md-6"><label class="text-secondary">Name</label><div class="fs-5 fw-semibold">${esc(p.name)}</div></div><div class="col-md-6"><label class="text-secondary">Mobile / Username</label><div class="fs-5 fw-semibold">${esc(p.mobile)}</div></div><div class="col-md-6"><label class="text-secondary">Email</label><div class="fs-5">${esc(p.email)}</div></div><div class="col-md-6"><label class="text-secondary">Registered City</label><div class="fs-5">${esc(p.city)}, ${esc(p.country)}</div></div></div>`});function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));}</script></body></html>
