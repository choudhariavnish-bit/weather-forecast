<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" role="img" aria-labelledby="title desc">
<title id="title">Globe highlighting India</title>
<desc id="desc">A blue globe with latitude and longitude lines and India highlighted.</desc>
<defs>
  <radialGradient id="g" cx="35%" cy="28%" r="75%"><stop offset="0" stop-color="#6ec8ff"/><stop offset=".65" stop-color="#1976d2"/><stop offset="1" stop-color="#073b7a"/></radialGradient>
  <clipPath id="clip"><circle cx="400" cy="400" r="330"/></clipPath>
  <filter id="shadow"><feDropShadow dx="0" dy="18" stdDeviation="18" flood-opacity=".25"/></filter>
</defs>
<circle cx="400" cy="400" r="330" fill="url(#g)" filter="url(#shadow)"/>
<g clip-path="url(#clip)" fill="none" stroke="#fff" stroke-opacity=".25" stroke-width="5">
  <ellipse cx="400" cy="400" rx="250" ry="330"/><ellipse cx="400" cy="400" rx="120" ry="330"/>
  <ellipse cx="400" cy="400" rx="330" ry="110"/><ellipse cx="400" cy="400" rx="330" ry="220"/>
  <path d="M70 400h660M105 285h590M105 515h590"/>
</g>
<!-- simplified India silhouette -->
<path d="M445 270l38 18 18 35 28 18 7 33 29 27-5 32-26 13-10 31-31 22-8 41-25 23-18-28-25-8-17-32-24-17 3-29-17-25 13-35 20-21 5-32 25-18 10-36z"
      fill="#ffb703" stroke="#fff" stroke-width="6" stroke-linejoin="round"/>
<circle cx="400" cy="400" r="330" fill="none" stroke="#fff" stroke-width="10" opacity=".8"/>
<text x="400" y="735" text-anchor="middle" fill="#fff" font-family="Arial,sans-serif" font-size="34" font-weight="700">INDIA</text>
</svg>
