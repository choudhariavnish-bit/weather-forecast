<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Select City - Weather Portal</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="css/app.css" rel="stylesheet"></head><body class="dashboard-bg"><div id="appNav"></div><main class="container-fluid py-4 px-lg-4"><div id="msg"></div><div class="row g-4"><div class="col-lg-8"><div class="card shadow-sm border-0"><div class="card-body p-3"><div class="d-flex justify-content-between align-items-center mb-3"><div><h4 class="mb-1">Select City</h4><div class="text-secondary">Search for a city or click on the map to select a location.</div></div><button id="useLocation" class="btn btn-outline-primary">Use My Location</button></div><div class="input-group mb-3"><span class="input-group-text">🔎</span><input id="citySearch" class="form-control" placeholder="Search city, e.g. Pune, India"></div><div id="map"></div></div></div></div><div class="col-lg-4"><div class="card shadow-sm border-0 mb-4"><div class="card-body"><h5>Selected City</h5><form id="cityForm"><div class="mb-3"><label class="form-label">City Name</label><input id="cityName" class="form-control" required></div><div class="mb-3"><label class="form-label">Country Code</label><input id="country" class="form-control" maxlength="2" value="IN" required></div><div class="row"><div class="col-6 mb-3"><label class="form-label">Latitude</label><input id="lat" class="form-control" readonly required></div><div class="col-6 mb-3"><label class="form-label">Longitude</label><input id="lon" class="form-control" readonly required></div></div><button class="btn btn-primary w-100">Add City to Database</button></form></div></div><div class="card shadow-sm border-0"><div class="card-body"><h5>Stored Cities</h5><div id="storedCities" class="list-group small"></div></div></div></div></div></main><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script><script src="js/nav.js"></script><script src="js/select-city.js"></script></body></html>
